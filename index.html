<!DOCTYPE html>
<html lang="en">
<head>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-C4SSC9NWG5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-C4SSC9NWG5');

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BRIGADE STELLARIS — Interactive Experience</title>
  <link rel="icon" href="data:,">
  <meta name="description" content="Brigade Stellaris — Explore your future home in an immersive experience." />
  <meta property="og:title" content="Brigade Stellaris" />
  <meta property="og:description" content="Interactive 3D property experience." />
  <meta property="og:image" content="preview.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Syne:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />

  <style>
    /* ═══════════════════════════════════════
       ZOHO GATE SCREEN  (fullscreen, z:9999)
       Shows BEFORE the 3D scene loads
    ═══════════════════════════════════════ */
    #zoho-gate {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #eae7e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      transition: opacity 0.65s ease;
    }
    #zoho-gate.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* Subtle city illustration overlay (mimics PDF background) */
    #zoho-gate::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      background-size: 200px;
      pointer-events: none;
      opacity: 0.5;
    }

    /* Card */
    #zoho-gate-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      margin: 40px 20px;
      padding: 44px 40px 40px;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 8px 48px rgba(0,0,0,.10), 0 2px 12px rgba(0,0,0,.06);
      box-sizing: border-box;
    }

    /* Header */
    .gate-logo {
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #1e2d3d;
      text-align: center;
      margin-bottom: 12px;
    }
    .gate-title {
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      font-weight: 600;
      color: #7a3e1e;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 4px;
    }
    .gate-subtitle {
      font-family: 'Syne', sans-serif;
      font-size: 9px;
      color: rgba(80,60,40,.45);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 28px;
    }
    .gate-rule {
      width: 40px; height: 1px;
      background: rgba(120,80,40,.20);
      margin: 0 auto 24px;
    }

    /* ── Zoho form field overrides ── */
    #crmWebToEntityForm {
      background: transparent !important;
      color: #2a2018 !important;
      max-width: 100% !important;
      padding: 0 !important;
    }
    .zcwf_title { display: none !important; }

    .zcwf_lblLeft .zcwf_row { margin: 0 0 16px 0 !important; }

    .zcwf_lblLeft .zcwf_col_lab {
      width: 100% !important;
      float: none !important;
      margin: 0 0 5px 0 !important;
      font-family: 'Syne', sans-serif !important;
      font-size: 9px !important;
      font-weight: 700 !important;
      letter-spacing: 0.16em !important;
      text-transform: uppercase !important;
      color: rgba(50,38,25,.60) !important;
    }
    .zcwf_lblLeft .zcwf_col_fld {
      width: 100% !important;
      float: none !important;
      padding: 0 !important;
      margin: 0 !important;
    }
    .zcwf_lblLeft .zcwf_col_fld input[type=text],
    .zcwf_lblLeft .zcwf_col_fld textarea {
      width: 100% !important;
      background: #f7f5f2 !important;
      border: 1px solid rgba(160,130,90,.25) !important;
      border-radius: 4px !important;
      color: #2a2018 !important;
      font-family: 'Syne', sans-serif !important;
      font-size: 13px !important;
      padding: 12px 14px !important;
      outline: none !important;
      transition: border-color 0.2s, background 0.2s !important;
      float: none !important;
      box-sizing: border-box !important;
    }
    .zcwf_lblLeft .zcwf_col_fld input[type=text]:focus,
    .zcwf_lblLeft .zcwf_col_fld textarea:focus {
      border-color: rgba(122,62,30,.50) !important;
      background: #ffffff !important;
    }
    .zcwf_lblLeft .zcwf_col_fld input[type=text]::placeholder {
      color: rgba(100,80,55,.35) !important;
    }

    /* Submit button */
    .formsubmit.zcwf_button {
      width: 100% !important;
      padding: 15px !important;
      background: #7a3e1e !important;
      color: #f5f0e8 !important;
      font-family: 'Syne', sans-serif !important;
      font-size: 10.5px !important;
      font-weight: 700 !important;
      letter-spacing: 0.18em !important;
      text-transform: uppercase !important;
      border: none !important;
      border-radius: 4px !important;
      cursor: pointer !important;
      margin-top: 6px !important;
      transition: opacity 0.2s, transform 0.2s !important;
    }
    .formsubmit.zcwf_button:hover {
      opacity: 0.88 !important;
      transform: translateY(-1px) !important;
    }
    .zcwf_button[name="reset"] { display: none !important; }

    /* Skip link */
    #gate-skip {
      margin-top: 18px;
      font-family: 'Syne', sans-serif;
      font-size: 9px;
      letter-spacing: 0.14em;
      color: rgba(100,80,55,.40);
      text-align: center;
      cursor: pointer;
      transition: color 0.2s;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    #gate-skip:hover { color: rgba(100,80,55,.65); }

    /* Success message */
    .wf_customMessageBox {
      font-family: 'Syne', sans-serif !important;
      font-size: 12px !important;
      color: #2a2018 !important;
    }

    /* Error message */
    .gate-error {
      font-family: 'Syne', sans-serif;
      font-size: 10.5px;
      color: #a33b2e;
      background: rgba(163,59,46,.08);
      border: 1px solid rgba(163,59,46,.20);
      border-radius: 4px;
      padding: 9px 12px;
      margin: 0 0 14px 0;
    }

    /* Mobile */
    @media (max-width: 480px) {
      #zoho-gate-card { padding: 36px 24px 32px; margin: 24px 16px; }
      .gate-logo { font-size: 13px; }
    }
  </style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
  <div class="loader-title">BRIGADE STELLARIS</div>
  <div class="loader-bar-wrap"><div class="loader-bar"></div></div>
  <div class="loader-sub">Loading Environment</div>
</div>

<!-- TRANSITION OVERLAY -->
<div id="transition-overlay"></div>

<!-- HOME VIEW (carousel injected by home.js) -->
<div id="home-view"></div>

<!-- ═══════════════════════════════════════════════════════
     ZOHO GATE — Fullscreen form shown BEFORE 3D loads
     Same pattern as the old Firebase login screen.
     After submit (or skip) → startApp() fires.
════════════════════════════════════════════════════════ -->
<div id="zoho-gate">
  <div id="zoho-gate-card">

    <div class="gate-logo">Brigade Stellaris</div>
    <div class="gate-title">Register Your Interest</div>
    <div class="gate-subtitle">Enter your details to begin the experience</div>
    <div class="gate-rule"></div>

    <!-- WHATSAPP OTP + SALESFORCE LEAD FORM -->
    <div id='crmWebToEntityForm' class='zcwf_lblLeft crmWebToEntityForm' style='background:transparent;'>
      <div class='wf_customMessageBox' id='wf_splash' style='display:none'>
        <div class='wf_customCircle'><div class='wf_customCheckMark'></div></div>
        <span id='wf_splash_info'></span>
      </div>

      <!-- STEP 1: DETAILS -->
      <form id='leadForm' autocomplete='off'>

        <div id='lead-error' class='gate-error' style='display:none;'></div>

        <!-- Name -->
        <div class='zcwf_row'>
          <div class='zcwf_col_lab'><label for='Name'>Name <span style='color:#c9a96e;'>*</span></label></div>
          <div class='zcwf_col_fld'>
            <input type='text' id='Name' maxlength='80' placeholder='Your name'/>
          </div>
        </div>

        <!-- Phone (WhatsApp) -->
        <div class='zcwf_row'>
          <div class='zcwf_col_lab'><label for='Phone'>WhatsApp Number <span style='color:#c9a96e;'>*</span></label></div>
          <div class='zcwf_col_fld'>
            <input type='text' id='Phone' maxlength='30' placeholder='+91 00000 00000'/>
          </div>
        </div>

        <!-- Email -->
        <div class='zcwf_row'>
          <div class='zcwf_col_lab'><label for='Email'>Email</label></div>
          <div class='zcwf_col_fld'>
            <input type='text' id='Email' maxlength='100' placeholder='your@email.com'/>
          </div>
        </div>

        <!-- Submit -->
        <div class='zcwf_row'>
          <div class='zcwf_col_lab'></div>
          <div class='zcwf_col_fld'>
            <input type='submit' id='sendOtpBtn' role='button' class='formsubmit zcwf_button' value='Send WhatsApp Code' aria-label='Send WhatsApp Code'/>
          </div>
        </div>
      </form>

      <!-- STEP 2: VERIFY OTP -->
      <form id='otpForm' autocomplete='off' style='display:none;'>
        <div class='gate-subtitle' style='margin-bottom:16px; text-align:left;'>
          Enter the 6-digit code sent to <span id='otp-phone-display'></span> on WhatsApp
        </div>

        <div id='otp-error' class='gate-error' style='display:none;'></div>

        <div class='zcwf_row'>
          <div class='zcwf_col_lab'><label for='otp_code'>Verification Code</label></div>
          <div class='zcwf_col_fld'>
            <input type='text' id='otp_code' maxlength='6' inputmode='numeric' placeholder='6-digit code'/>
          </div>
        </div>

        <div class='zcwf_row'>
          <div class='zcwf_col_lab'></div>
          <div class='zcwf_col_fld'>
            <input type='submit' id='verifyOtpBtn' role='button' class='formsubmit zcwf_button' value='Verify & Continue' aria-label='Verify and Continue'/>
          </div>
        </div>

        <div id='resend-otp' style='text-align:center;margin-top:12px;font-family:"Syne",sans-serif;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:rgba(100,80,55,.45);cursor:pointer;text-decoration:underline;text-underline-offset:3px;'>Resend Code</div>
      </form>

      <script>
        // ── Backend that performs WhatsApp OTP send/verify and Salesforce lead creation ──
        // TODO: replace with your deployed NestJS backend URL once live.
        var OTP_API_BASE = 'http://localhost:3000/api';

        var leadForm  = document.getElementById('leadForm');
        var otpForm   = document.getElementById('otpForm');
        var leadError = document.getElementById('lead-error');
        var otpError  = document.getElementById('otp-error');
        var phoneDisplay = document.getElementById('otp-phone-display');
        var resendBtn = document.getElementById('resend-otp');

        var leadData = {};

        function showErr(el, msg) { el.textContent = msg; el.style.display = ''; }
        function hideErr(el) { el.style.display = 'none'; }

        function isValidEmail(v) {
          if (!v) return true; // email optional
          var a = v.indexOf('@'), d = v.lastIndexOf('.');
          return !(a < 1 || d < a + 2 || d + 2 >= v.length);
        }

        function setBtnLoading(btn, loading, label) {
          btn.disabled = loading;
          btn.value = loading ? 'Please wait…' : label;
        }

        leadForm.addEventListener('submit', function (e) {
          e.preventDefault();
          hideErr(leadError);

          var name  = document.getElementById('Name').value.trim();
          var phone = document.getElementById('Phone').value.trim();
          var email = document.getElementById('Email').value.trim();

          if (!name)  { showErr(leadError, 'Name cannot be empty.'); return; }
          if (!phone) { showErr(leadError, 'WhatsApp number is required to verify you.'); return; }
          if (!isValidEmail(email)) { showErr(leadError, 'Please enter a valid email address.'); return; }

          leadData = {
            name: name,
            phone: phone,
            email: email
          };

          var btn = document.getElementById('sendOtpBtn');
          setBtnLoading(btn, true, 'Send WhatsApp Code');

          if (typeof gtag === 'function') {
            gtag('event', 'lead_form_submit', { form_id: 'brigade_stellaris_gate' });
          }

          // Capture GA4 Client ID so we can tag the Salesforce Lead with it —
          // this is the shared key that lets us match GA4 activity to the Lead record later.
          function withGaClientId(callback) {
            if (typeof gtag === 'function') {
              var called = false;
              var safeCallback = function () {
                if (called) return;
                called = true;
                callback();
              };
              gtag('get', 'G-C4SSC9NWG5', 'client_id', function (clientId) {
                leadData.gaClientId = clientId || null;
                safeCallback();
              });
              // Fallback in case the callback never fires (ad-blockers etc.)
              setTimeout(safeCallback, 400);
            } else {
              callback();
            }
          }

          withGaClientId(function () {
          fetch(OTP_API_BASE + '/otp/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: phone })
          })
            .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
            .then(function (res) {
              if (!res.ok || !res.data.success) {
                throw new Error((res.data && res.data.message) || 'Could not send code. Check the number and try again.');
              }
              if (typeof gtag === 'function') {
                gtag('event', 'otp_sent', { method: 'whatsapp' });
              }
              phoneDisplay.textContent = phone;
              leadForm.style.display = 'none';
              otpForm.style.display = '';
            })
            .catch(function (err) {
              showErr(leadError, err.message || 'Something went wrong. Please try again.');
            })
            .finally(function () {
              setBtnLoading(btn, false, 'Send WhatsApp Code');
            });
          }); // end withGaClientId
        });

        otpForm.addEventListener('submit', function (e) {
          e.preventDefault();
          hideErr(otpError);

          var code = document.getElementById('otp_code').value.trim();
          if (!code) { showErr(otpError, 'Enter the code sent to your WhatsApp.'); return; }

          var btn = document.getElementById('verifyOtpBtn');
          setBtnLoading(btn, true, 'Verify & Continue');

          fetch(OTP_API_BASE + '/otp/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              phone: leadData.phone,
              code: code,
              name: leadData.name,
              email: leadData.email,
              gaClientId: leadData.gaClientId || null
            })
          })
            .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
            .then(function (res) {
              if (!res.ok || !res.data.success) {
                throw new Error((res.data && res.data.message) || 'Incorrect or expired code.');
              }
              // Backend has verified the code and created the Salesforce Lead.
              if (typeof gtag === 'function') {
                gtag('event', 'generate_lead', {
                  method: 'whatsapp_otp',
                  currency: 'INR'
                });
              }
              var info = document.getElementById('wf_splash_info');
              info.innerText = 'Thank you! Launching experience…';
              document.getElementById('wf_splash').style.display = '';
              otpForm.style.display = 'none';
              setTimeout(function () { dismissGateAndStart(); }, 1500);
            })
            .catch(function (err) {
              showErr(otpError, err.message || 'Verification failed. Please try again.');
            })
            .finally(function () {
              setBtnLoading(btn, false, 'Verify & Continue');
            });
        });

        resendBtn.addEventListener('click', function () {
          if (!leadData.phone) return;
          resendBtn.textContent = 'Sending…';
          fetch(OTP_API_BASE + '/otp/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: leadData.phone })
          })
            .then(function () {
              resendBtn.textContent = 'Code resent ✓';
              setTimeout(function () { resendBtn.textContent = 'Resend Code'; }, 3000);
            })
            .catch(function () {
              resendBtn.textContent = 'Resend failed — tap to retry';
            });
        });
      </script>
    </div>
    <!-- END LEAD FORM -->

    <!-- Skip link for internal team testing -->
    <div id="gate-skip" onclick="dismissGateAndStart()">Skip — Enter Experience</div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<!-- App modules -->
<script src="js/home.js"></script>
<script src="js/floorplan.js"></script>
<script src="js/gallery.js"></script>

<script>
/* ─── GATE DISMISS → START 3D APP ─── */
let _appStarted = false;

function dismissGateAndStart() {
  if (_appStarted) return;
  _appStarted = true;

  var gate = document.getElementById('zoho-gate');
  if (gate) {
    gate.classList.add('fade-out');
    setTimeout(function() { gate.remove(); }, 700);
  }

  if (typeof gtag === 'function') {
    gtag('event', 'experience_start');
  }

  // Start the 3D modules — same as firebase-auth.js did
  if (window.HomeModule      && typeof HomeModule.init      === 'function') HomeModule.init();
  if (window.FloorplanModule && typeof FloorplanModule.init === 'function') FloorplanModule.init();
  if (window.GalleryModule   && typeof GalleryModule.init   === 'function') GalleryModule.init();
}

/* ─── APP CONTROLLER ─── */
window.App = {
  currentView: 'home',
  previousView: null,

  init() {
    // Do NOT auto-start — gate controls when 3D begins
    // (HomeModule.init is called by dismissGateAndStart)
  },

  finishLoad() {
    const loader = document.getElementById('loader');
    if (!loader) return;
    loader.classList.add('fade-out');
    setTimeout(() => {
      loader.style.display = 'none';
      const hv = document.getElementById('home-view');
      if (hv) hv.classList.add('active');
    }, 900);
  },

  navigate(view, opts = {}) {
    const overlay = document.getElementById('transition-overlay');
    overlay.classList.add('flash');
    overlay.addEventListener('animationend', () => {
      this._doNavigate(view, opts);
      overlay.classList.remove('flash');
    }, { once: true });
  },

  _doNavigate(view, opts) {
    const ur = document.getElementById('unit-row');
    if (ur) ur.classList.remove('visible');

    const btn360 = document.querySelector('.panel-slot[data-slot="360view"]');
    if (btn360) btn360.classList.remove('unit-open', 'active');

    document.getElementById('home-view').classList.remove('active');

    this.previousView = this.currentView;
    this.currentView  = view;

    if (view === 'home') {
      document.getElementById('home-view').classList.add('active');
    }

    document.querySelectorAll('.panel-slot').forEach(el => el.classList.remove('active'));
    const activeSlot = document.querySelector(`.panel-slot[data-slot="${view}"]`);
    if (activeSlot) activeSlot.classList.add('active');

    // Track this view switch in GA4 — lets you see which sections people
    // actually reach and how they move between them (home -> floorplan -> gallery etc.)
    if (typeof gtag === 'function') {
      gtag('event', 'view_change', {
        view_name: view,
        previous_view: this.previousView || 'none'
      });
    }
  },

  goBack() {
    this.navigate(this.previousView || 'home');
  }
};

App.init();
</script>

</body>
</html>
