<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BRIGADE-RAPATAKOS — Interactive Experience</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Syne:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- LOADER -->
<div id="loader">
  <div class="loader-title">BRIGADE-RAPATAKOS</div>
  <div class="loader-bar-wrap"><div class="loader-bar"></div></div>
  <div class="loader-sub">Loading Environment</div>
</div>

<!-- TRANSITION OVERLAY -->
<div id="transition-overlay"></div>

<!-- HOME VIEW -->
<div id="home-view">
  <canvas id="three-canvas"></canvas>
</div>

<!-- 1. Three.js core -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- 2. GLTFLoader -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<!-- 3. Modules -->
<script type="module" src="js/firebase-auth.js"></script> 
<script src="js/home.js"></script>
<script src="js/floorplan.js"></script>

<!-- 4. App controller -->
<script>

window.App = {
  currentView: 'home',
  previousView: null,

  init() {
    setTimeout(() => this.finishLoad(), 2400);
  },

 finishLoad() {
  const loader = document.getElementById('loader');
  loader.classList.add('fade-out');
  setTimeout(() => {
    loader.style.display = 'none';
    document.getElementById('home-view').classList.add('active');
    // HomeModule.init() removed — firebase-auth.js handles this after login
  }, 900);
},

  navigate(view, opts = {}) {
    const overlay = document.getElementById('transition-overlay');
    overlay.classList.add('flash');
    setTimeout(() => {
      this._doNavigate(view, opts);
      overlay.classList.remove('flash');
    }, 350);
  },

  _doNavigate(view, opts) {
    const ur = document.getElementById('unit-row');
    if (ur) ur.classList.remove('visible');

    const btn360 = document.querySelector('.panel-slot[data-slot="360view"]');
    if (btn360) btn360.classList.remove('unit-open', 'active');

    document.getElementById('home-view').classList.remove('active');

    this.previousView = this.currentView;
    this.currentView  = view;

    if (view === 'home') {
      document.getElementById('home-view').classList.add('active');
    }

    document.querySelectorAll('.panel-slot').forEach(el => el.classList.remove('active'));
    const activeSlot = document.querySelector(`.panel-slot[data-slot="${view}"]`);
    if (activeSlot) activeSlot.classList.add('active');
  },

  goBack() {
    this.navigate(this.previousView || 'home');
  }

};

App.init();
</script>

</body>
</html>
