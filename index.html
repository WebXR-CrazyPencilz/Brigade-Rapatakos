      align-items: center;
      animation: overlayIn 0.3s ease;

    @keyframes overlayIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    #zoho-modal-box {
      background: #111114;
      border: 1px solid rgba(201,169,110,0.25);
      border-radius: 4px;
      width: 100%;
      max-width: 480px;
      margin: 20px;
      padding: 40px 36px 36px;
      position: relative;
      animation: modalIn 0.35s cubic-bezier(0.22,1,0.36,1);

    }
    @keyframes modalIn {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ─── CLOSE BUTTON ─── */

        <script>
          function validateEmail1309230000000456421(){
            var form = document.forms['WebToLeads1309230000000456421'];
            var emailFld = form.querySelectorAll('[ftype=email]');
            for(var i=0;i<emailFld.length;i++){
              var emailVal = emailFld[i].value;
              if((emailVal.replace(/^\s+|\s+$/g,'')).length!=0){
                var atpos=emailVal.indexOf('@');
                var dotpos=emailVal.lastIndexOf('.');
                if(atpos<1||dotpos<atpos+2||dotpos+2>=emailVal.length){
                  alert('Please enter a valid email address.');
                  emailFld[i].focus();
                  return false;
                }
              }
            }
            return true;
          }

          function checkMandatory1309230000000456421(){
            var mndFileds=['Last Name'];
            var fldLangVal=['Last Name'];
            for(var i=0;i<mndFileds.length;i++){
              var fieldObj=document.forms['WebToLeads1309230000000456421'][mndFileds[i]];
              if(fieldObj){
                if(((fieldObj.value).replace(/^\s+|\s+$/g,'')).length==0){
                  alert(fldLangVal[i]+' cannot be empty.');
                  fieldObj.focus();
                  return false;

              }
            }
            if(!validateEmail1309230000000456421()) return false;
            document.querySelector('.crmWebToEntityForm .formsubmit').setAttribute('disabled',true);

          function captchaFailedHandling1309230000000456421(message){
            var capErr=document.getElementById('captchaErr1309230000000456421');
            if(capErr){ capErr.innerHTML=message; capErr.style.visibility='visible'; setTimeout(function(){capErr.style.visibility='hidden';},5000); }
          }

          document.getElementById('webform1309230000000456421').addEventListener('submit',function(e){
            var ismandatory=checkMandatory1309230000000456421();
            e.preventDefault();
            if(ismandatory===undefined||ismandatory){
              var formData=new FormData(this);
              fetch('https://crm.zoho.in/crm/WebToLeadForm',{
                method:'POST',body:formData,cache:'no-cache'
              }).then(function(response){
                var ct=response.headers.get('Content-Type');
                return ct&&ct.includes('application/json')?response.json():response.text();
              }).then(function(data){
                if(typeof data==='object'){
                  if(data.actionsubmit==='Splash Message'){
                    if(data.invalidCaptcha&&data.invalidCaptcha==='true'){
                      captchaFailedHandling1309230000000456421(data.actionvalue);
                    } else {
                      var splashinfodom=document.getElementById('wf_splash_info');
                      splashinfodom.innerText=data.actionvalue||'Thank you! We will be in touch shortly.';
                      var splashdom=document.getElementById('wf_splash');
                      document.getElementById('webform1309230000000456421').reset.click();
                      splashdom.style.display='';

                    window.location.assign(data.redirectUrl);
                  } else if(data.actionsubmit==='error_msg'){
                    alert(data.message);
                  }
                } else {
                  document.write(data);
                }
                var formDom=document.querySelector('.crmWebToEntityForm .formsubmit');
                if(formDom) formDom.removeAttribute('disabled');
              }).catch(function(){
                alert('An error occurred. Please try again.');
                var formDom=document.querySelector('.crmWebToEntityForm .formsubmit');
                if(formDom) formDom.removeAttribute('disabled');
              });

<script>

/* ─── ZOHO MODAL CONTROLS ─── */
function openZohoForm() {
  var overlay = document.getElementById('zoho-modal-overlay');
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeZohoForm() {
  var overlay = document.getElementById('zoho-modal-overlay');
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('zoho-modal-overlay')) {
    closeZohoForm();
  }
}

/* ─── ESC key closes modal ─── */
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeZohoForm();
});

/* ─── APP CONTROLLER ─── */
window.App = {
  currentView: 'home',
  previousView: null,

  init() {
    setTimeout(() => this.finishLoad(), 2400);
  },

  finishLoad() {
    const loader = document.getElementById('loader');
    loader.classList.add('fade-out');
    setTimeout(() => {
      loader.style.display = 'none';
      document.getElementById('home-view').classList.add('active');
    }, 900);
  },

  navigate(view, opts = {}) {
    const overlay = document.getElementById('transition-overlay');
    overlay.classList.add('flash');
    overlay.addEventListener('animationend', () => {
      this._doNavigate(view, opts);
      overlay.classList.remove('flash');
    }, { once: true });
  },

  _doNavigate(view, opts) {
    const ur = document.getElementById('unit-row');
    if (ur) ur.classList.remove('visible');

    const btn360 = document.querySelector('.panel-slot[data-slot="360view"]');
    if (btn360) btn360.classList.remove('unit-open', 'active');

    document.getElementById('home-view').classList.remove('active');

    this.previousView = this.currentView;
    this.currentView  = view;

    if (view === 'home') {
      document.getElementById('home-view').classList.add('active');
    }

    document.querySelectorAll('.panel-slot').forEach(el => el.classList.remove('active'));
    const activeSlot = document.querySelector(`.panel-slot[data-slot="${view}"]`);
    if (activeSlot) activeSlot.classList.add('active');
  },

  goBack() {
    this.navigate(this.previousView || 'home');
  }
};

App.init();
</script>
