<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Syne+Mono&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #0a0a0a;
      --surface:  #111111;
      --border:   #232323;
      --accent:   #c8f135;
      --muted:    #404040;
      --text:     #f0f0f0;
      --text-dim: #888;
    }
    html, body { width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; overflow: hidden; }

    #loader {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: var(--bg); z-index: 100; gap: 20px;
      transition: opacity 0.7s ease, visibility 0.7s ease;
    }
    #loader.hidden { opacity: 0; visibility: hidden; }
    .loader-label { font-size: 10px; letter-spacing: 0.35em; text-transform: uppercase; color: var(--text-dim); font-family: 'Syne Mono', monospace; }
    .progress-wrap { width: 180px; height: 1px; background: var(--border); }
    .progress-bar { height: 100%; width: 0%; background: var(--accent); transition: width 0.3s ease; }

    #canvas-wrap { width: 100%; height: 100%; }
    canvas { display: block; width: 100% !important; height: 100% !important; }

    #badge {
      position: fixed; top: 24px; left: 28px;
      font-size: 9px; letter-spacing: 0.35em; text-transform: uppercase;
      color: var(--muted); font-family: 'Syne Mono', monospace;
      z-index: 10; opacity: 0; transition: opacity 0.5s ease 0.5s;
    }
    #badge.visible { opacity: 1; }

    #btn-reset {
      position: fixed; bottom: 28px; right: 28px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text-dim); cursor: pointer;
      padding: 8px 16px; border-radius: 5px;
      font-family: 'Syne Mono', monospace; font-size: 9px;
      letter-spacing: 0.2em; text-transform: uppercase;
      display: flex; align-items: center; gap: 7px;
      transition: background 0.15s, color 0.15s, opacity 0.5s ease 0.5s;
      opacity: 0; z-index: 10;
    }
    #btn-reset.visible { opacity: 1; }
    #btn-reset:hover { background: var(--border); color: var(--text); }
    #btn-reset svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2; }
  </style>
</head>
<body>

<div id="loader">
  <div class="loader-label">Loading scene</div>
  <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
</div>

<div id="canvas-wrap"></div>
<div id="badge">3D Viewer</div>

<button id="btn-reset">
  <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
  Reset
</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="main.js"></script>
</body>
</html>
