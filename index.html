<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) — GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-C4SSC9NWG5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-C4SSC9NWG5');
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BRIGADE STELLARIS — Interactive Experience</title>
  <link rel="icon" href="data:,">
  <meta name="description" content="Brigade Stellaris — Explore your future home in an immersive experience." />
  <meta property="og:title" content="Brigade Stellaris" />
  <meta property="og:description" content="Interactive 3D property experience." />
  <meta property="og:image" content="preview.jpg" />
  <meta name="theme-color" content="#0d0d0d" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Syne:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />

  <style>
    /* ═══════════════════════════════════════
       LEAD GATE SCREEN  (fullscreen, z:9999)
       Shows BEFORE the 3D scene loads
    ═══════════════════════════════════════ */
    #lead-gate {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #eae7e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      transition: opacity 0.65s ease;
    }
    #lead-gate.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* Subtle city illustration overlay (mimics PDF background) */
    #lead-gate::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      background-size: 200px;
      pointer-events: none;
      opacity: 0.5;
    }

    /* Card */
    #lead-gate-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      margin: 40px 20px;
      padding: 44px 40px 40px;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 8px 48px rgba(0,0,0,.10), 0 2px 12px rgba(0,0,0,.06);
      box-sizing: border-box;
    }

    /* Header */
    .gate-logo {
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #1e2d3d;
      text-align: center;
      margin-bottom: 12px;
    }
    .gate-title {
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      font-weight: 600;
      color: #7a3e1e;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 4px;
    }
    .gate-subtitle {
      font-family: 'Syne', sans-serif;
      font-size: 9px;
      color: rgba(80,60,40,.45);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 28px;
    }
    .gate-rule {
      width: 40px; height: 1px;
      background: rgba(120,80,40,.20);
      margin: 0 auto 24px;
    }

    /* ── Lead form field styles ── */
    #lead-gate-form {
      background: transparent;
      color: #2a2018;
      max-width: 100%;
      padding: 0;
    }

    .gate_row { margin: 0 0 16px 0; }

    .gate_col_lab {
      width: 100%;
      margin: 0 0 5px 0;
      font-family: 'Syne', sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(50,38,25,.60);
    }
    .gate_col_fld {
      width: 100%;
      padding: 0;
      margin: 0;
    }
    .gate_col_fld input[type=text] {
      width: 100%;
      background: #f7f5f2;
      border: 1px solid rgba(160,130,90,.25);
      border-radius: 4px;
      color: #2a2018;
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      box-sizing: border-box;
    }
    .gate_col_fld input[type=text]:focus {
      border-color: rgba(122,62,30,.50);
      background: #ffffff;
    }
    .gate_col_fld input[type=text]::placeholder {
      color: rgba(100,80,55,.35);
    }

    /* Submit button */
    .gate_button {
      width: 100%;
      padding: 15px;
      background: #7a3e1e;
      color: #f5f0e8;
      font-family: 'Syne', sans-serif;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 6px;
      transition: opacity 0.2s, transform 0.2s;
    }
    .gate_button:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    /* Success message */
    .gate_success_box {
      font-family: 'Syne', sans-serif !important;
      font-size: 12px !important;
      color: #2a2018 !important;
    }

    /* Error message */
    .gate-error {
      font-family: 'Syne', sans-serif;
      font-size: 10.5px;
      color: #a33b2e;
      background: rgba(163,59,46,.08);
      border: 1px solid rgba(163,59,46,.20);
      border-radius: 4px;
      padding: 9px 12px;
      margin: 0 0 14px 0;
    }

    /* Mobile */
    @media (max-width: 480px) {
      #lead-gate-card { padding: 36px 24px 32px; margin: 24px 16px; }
      .gate-logo { font-size: 13px; }
    }
  </style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
  <div class="loader-title">BRIGADE STELLARIS</div>
  <div class="loader-bar-wrap"><div class="loader-bar"></div></div>
  <div class="loader-sub">Loading Environment</div>
</div>

<!-- TRANSITION OVERLAY -->
<div id="transition-overlay"></div>

<!-- HOME VIEW (carousel injected by home.js) -->
<div id="home-view"></div>

<!-- ═══════════════════════════════════════════════════════
     LEAD GATE — Fullscreen form shown BEFORE 3D loads
     Same pattern as the old Firebase login screen.
     After submit → startApp() fires.
════════════════════════════════════════════════════════ -->
<div id="lead-gate">
  <div id="lead-gate-card">

    <div class="gate-logo">Brigade Stellaris</div>
    <div class="gate-title">Register Your Interest</div>
    <div class="gate-subtitle">Enter your details to begin the experience</div>
    <div class="gate-rule"></div>

    <!-- LEAD FORM -->
    <div id='lead-gate-form'>
      <div class='gate_success_box' id='gate-success' style='display:none'>
        <div class='wf_customCircle'><div class='wf_customCheckMark'></div></div>
        <span id='gate-success-info'></span>
      </div>

      <form id='leadForm' autocomplete='off'>

        <div id='lead-error' class='gate-error' style='display:none;'></div>

        <!-- Name -->
        <div class='gate_row'>
          <div class='gate_col_lab'><label for='Name'>Name <span style='color:#c9a96e;'>*</span></label></div>
          <div class='gate_col_fld'>
            <input type='text' id='Name' maxlength='80' placeholder='Your name'/>
          </div>
        </div>

        <!-- Phone (WhatsApp) -->
        <div class='gate_row'>
          <div class='gate_col_lab'><label for='Phone'>WhatsApp Number <span style='color:#c9a96e;'>*</span></label></div>
          <div class='gate_col_fld'>
            <input type='text' id='Phone' maxlength='30' placeholder='+91 00000 00000'/>
          </div>
        </div>

        <!-- Email -->
        <div class='gate_row'>
          <div class='gate_col_lab'><label for='Email'>Email</label></div>
          <div class='gate_col_fld'>
            <input type='text' id='Email' maxlength='100' placeholder='your@email.com'/>
          </div>
        </div>

        <!-- Submit -->
        <div class='gate_row'>
          <div class='gate_col_lab'></div>
          <div class='gate_col_fld'>
            <input type='submit' id='submitLeadBtn' role='button' class='gate_button' value='Submit' aria-label='Submit'/>
          </div>
        </div>
      </form>
    </div>
    <!-- END LEAD FORM -->

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<!-- App modules -->
<script src="js/home.js"></script>
<script src="js/floorplan.js"></script>
<script src="js/gallery.js"></script>

<!-- Lead collection — communicates only with the Google Apps Script Web App -->
<script src="js/Config.js"></script>
<script src="js/lead.js"></script>

<script>
/* ─── GATE DISMISS → START 3D APP ─── */
let _appStarted = false;

function dismissGateAndStart() {
  if (_appStarted) return;
  _appStarted = true;

  var gate = document.getElementById('lead-gate');
  if (gate) {
    gate.classList.add('fade-out');
    setTimeout(function() { gate.remove(); }, 700);
  }

  if (typeof gtag === 'function') {
    gtag('event', 'experience_start');
  }

  // Start the 3D modules — same as firebase-auth.js did
  if (window.HomeModule      && typeof HomeModule.init      === 'function') HomeModule.init();
  if (window.FloorplanModule && typeof FloorplanModule.init === 'function') FloorplanModule.init();
  if (window.GalleryModule   && typeof GalleryModule.init   === 'function') GalleryModule.init();
}

/* ─── APP CONTROLLER ─── */
window.App = {
  currentView: 'home',
  previousView: null,

  init() {
    // Do NOT auto-start — gate controls when 3D begins
    // (HomeModule.init is called by dismissGateAndStart)
  },

  finishLoad() {
    const loader = document.getElementById('loader');
    if (!loader) return;
    loader.classList.add('fade-out');
    setTimeout(() => {
      loader.style.display = 'none';
      const hv = document.getElementById('home-view');
      if (hv) hv.classList.add('active');
    }, 900);
  },

  navigate(view, opts = {}) {
    const overlay = document.getElementById('transition-overlay');
    overlay.classList.add('flash');
    overlay.addEventListener('animationend', () => {
      this._doNavigate(view, opts);
      overlay.classList.remove('flash');
    }, { once: true });
  },

  _doNavigate(view, opts) {
    const ur = document.getElementById('unit-row');
    if (ur) ur.classList.remove('visible');

    const btn360 = document.querySelector('.panel-slot[data-slot="360view"]');
    if (btn360) btn360.classList.remove('unit-open', 'active');

    document.getElementById('home-view').classList.remove('active');

    this.previousView = this.currentView;
    this.currentView  = view;

    if (view === 'home') {
      document.getElementById('home-view').classList.add('active');
    }

    document.querySelectorAll('.panel-slot').forEach(el => el.classList.remove('active'));
    const activeSlot = document.querySelector(`.panel-slot[data-slot="${view}"]`);
    if (activeSlot) activeSlot.classList.add('active');

    // Track this view switch in GA4 — lets you see which sections people
    // actually reach and how they move between them (home -> floorplan -> gallery etc.)
    if (typeof gtag === 'function') {
      gtag('event', 'view_change', {
        view_name: view,
        previous_view: this.previousView || 'none'
      });
    }
  },

  goBack() {
    this.navigate(this.previousView || 'home');
  }
};

App.init();
</script>

</body>
</html>
