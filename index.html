<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) — GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-C4SSC9NWG5"></script>
  <script>

    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-C4SSC9NWG5');

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BRIGADE STELLARIS — Interactive Experience</title>
  <link rel="icon" href="data:,">
  <meta name="description" content="Brigade Stellaris — Explore your future home in an immersive experience." />
  <meta property="og:title" content="Brigade Stellaris" />
  <meta property="og:description" content="Interactive 3D property experience." />
  <meta property="og:image" content="preview.jpg" />
  <meta name="theme-color" content="#0d0d0d" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Syne:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />

  <style>
    /* ═══════════════════════════════════════════════════════
       BRIGADE STELLARIS — Landing Gate
       Fullscreen, shown BEFORE the 3D scene loads.
       After a successful lead submission → dismissGateAndStart()
       fades this out and hands off to the interactive experience.
    ═══════════════════════════════════════════════════════ */

    #lead-gate {
      --brg-bronze: #A56A3C;
      --brg-navy: #101726;
      --brg-white: #FFFFFF;
      --brg-text-secondary: rgba(255, 255, 255, 0.75);
      --brg-glass-border: rgba(255, 255, 255, 0.15);

      /* Paste your Cloudinary hero image URL below — everything else
         (cover / center / fixed / responsive) is already wired up.
         Until it's set, a navy gradient stands in as a graceful
         fallback so the page still reads as finished. */
      --brg-hero-image: url('https://res.cloudinary.com/dp5ifzgge/image/upload/v1783919319/landingpage_nbfdrr.jpg');

      position: fixed;
      inset: 0;
      z-index: 9999;
      height: 100vh;   /* fallback for older browsers without dvh support */
      height: 100dvh;  /* the real, current mobile viewport — shrinks/grows
                           as the browser's address bar shows/hides, so this
                           is the ONE place "full screen height" is decided */
      overflow-y: auto;
      overflow-x: hidden;
      color: var(--brg-white);
      font-family: 'Inter', sans-serif;
      transition: opacity 0.7s ease;
    }
    #lead-gate.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* ── Hero background layer — plain, no scrim ──
       A separate position:fixed layer (rather than
       background-attachment:fixed on the scrolling container) so the
       image stays truly pinned to the viewport even on iOS Safari,
       where background-attachment:fixed is unreliable.
       The image itself already contains the full brand design (logo,
       headline, accent), so no dark overlay is layered on top of it
       here — the card below supplies its own contrast independently.
       background-position is overridden to "right" at narrower
       widths (see the ≤1024px query below) — cover naturally crops
       more aggressively on tall/narrow screens, so anchoring to the
       right pushes the headline (on the image's left side) out of
       frame instead of letting it land under the card. */
    .brg-hero-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: var(--brg-hero-image),
        linear-gradient(160deg, #0c111d 0%, #16202f 55%, #0c111d 100%);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* ── Layout shell — card only, positioned over the right side
       of the image so it doesn't sit over the headline baked into
       the left side of the artwork ── */
    .brg-layout {
      position: relative;
      z-index: 2;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      max-width: 1440px;
      margin: 0 auto;
      padding: 56px clamp(24px, 6vw, 96px);
      box-sizing: border-box;
    }

    /* ── Registration card ── */
    .brg-right {
      display: flex;
      justify-content: center;
      animation: brgFadeUp 0.9s ease both;
    }

    .brg-card {
      width: 100%;
      max-width: 420px;
      padding: 44px 40px 40px;
      background: rgba(16, 23, 38, 0.55);
      border: 1px solid var(--brg-glass-border);
      border-radius: 14px;
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 24px 70px rgba(0,0,0,0.45), 0 2px 10px rgba(0,0,0,0.25);
      box-sizing: border-box;
    }

    .brg-card-brand {
      font-family: 'Syne', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      text-align: center;
      color: var(--brg-white);
      margin-bottom: 18px;
    }

    .brg-card-title {
      margin: 0 0 8px;
      font-family: 'Syne', sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.01em;
      text-align: center;
      color: var(--brg-white);
    }

    .brg-card-subtitle {
      margin: 0 0 30px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
      color: var(--brg-text-secondary);
    }

    /* ── Form ── */
    .brg-field {
      margin: 0 0 18px;
    }

    .brg-label {
      display: block;
      margin: 0 0 8px;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--brg-text-secondary);
    }
    .brg-req {
      color: var(--brg-bronze);
    }

    .brg-input {
      width: 100%;
      padding: 13px 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--brg-glass-border);
      border-radius: 6px;
      color: var(--brg-white);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease;
      box-sizing: border-box;
    }
    .brg-input::placeholder {
      color: rgba(255, 255, 255, 0.35);
    }
    .brg-input:focus {
      border-color: var(--brg-bronze);
      background: rgba(255, 255, 255, 0.10);
    }
    .brg-input:focus-visible {
      outline: 2px solid var(--brg-bronze);
      outline-offset: 2px;
    }

    /* ── Submit ── */
    .brg-submit {
      width: 100%;
      margin-top: 8px;
      padding: 15px;
      background: var(--brg-bronze);
      color: var(--brg-white);
      border: none;
      border-radius: 6px;
      font-family: 'Syne', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.20em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .brg-submit:hover {
      opacity: 0.90;
      transform: translateY(-1px);
    }
    .brg-submit:focus-visible {
      outline: 2px solid var(--brg-white);
      outline-offset: 3px;
    }
    .brg-submit:disabled {
      opacity: 0.65;
      cursor: default;
      transform: none;
    }

    /* ── Skip — deliberately small/low-emphasis, never competes
       visually with the primary "Begin Experience" CTA above it ── */
    .brg-skip {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 4px;
      background: transparent;
      border: none;
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
      color: rgba(255, 255, 255, 0.40);
      cursor: pointer;
      transition: color 0.2s ease;
    }
    .brg-skip:hover {
      color: rgba(255, 255, 255, 0.70);
    }
    .brg-skip:focus-visible {
      outline: 1px solid var(--brg-bronze);
      outline-offset: 2px;
    }

    /* ── Error ── */
    .brg-error {
      margin: 0 0 16px;
      padding: 11px 14px;
      background: rgba(214, 90, 70, 0.14);
      border: 1px solid rgba(214, 90, 70, 0.32);
      border-radius: 6px;
      font-family: 'Inter', sans-serif;
      font-size: 12.5px;
      line-height: 1.5;
      color: #f3c6bd;
    }

    /* ── Motion ── */
    @keyframes brgFadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .brg-right { animation: none; }
      #lead-gate, .brg-submit { transition: none; }
    }

    /* ── Tablet — card moves to the left, over the image ── */
    @media (max-width: 1024px) {
      .brg-layout {
        justify-content: flex-end;
        padding: 48px clamp(24px, 6vw, 64px) 64px;
      }

      /* At narrower widths, cover/center would put the headline baked
         into the image right under the card. Anchoring the crop to
         the right pushes that headline (on the image's left side)
         out of frame, while the card stays on the right where the
         image has clear space. Pure CSS — no second image request
         needed. The extra card opacity is a readability safety net
         either way. */
      .brg-hero-bg {
        background-position: right;
      }
      .brg-card {
        background: rgba(16, 23, 38, 0.82);
      }
    }

    /* ── Mobile — full-screen background, card centered ──
       (crop position + card opacity for readability are already
       applied by the ≤1024px block above, which covers this range too.
       Centering here — rather than the tablet block's flex-end — is
       safe because the crop already keeps the headline fully out of
       frame at this width, so there's no overlap risk either way. ) */
    @media (max-width: 640px) {
      .brg-layout {
        align-items: center;
        justify-content: center;
        padding: 20px 16px;
      }

      /* Nearly full-width and noticeably taller/roomier than the
         desktop card — on a phone screen the previous compact sizing
         read as a small floating widget rather than the main event. */
      .brg-right {
        width: 100%;
      }
      .brg-card {
        max-width: 480px;
        width: 100%;
        padding: 44px 28px 40px;
      }

      .brg-card-brand { font-size: 13px; margin-bottom: 20px; }
      .brg-card-title { font-size: 24px; }
      .brg-card-subtitle { font-size: 14px; margin-bottom: 34px; }

      .brg-field { margin-bottom: 22px; }
      .brg-label { font-size: 12px; margin-bottom: 10px; }

      /* font-size:16px specifically avoids iOS Safari's automatic
         zoom-on-focus behavior for inputs sized smaller than that */
      .brg-input {
        padding: 17px 18px;
        font-size: 16px;
        border-radius: 8px;
      }

      .brg-submit {
        padding: 19px;
        font-size: 13px;
        border-radius: 8px;
        margin-top: 12px;
      }

      .brg-skip {
        font-size: 11px;
        margin-top: 18px;
      }
    }
  </style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
  <div class="loader-title">BRIGADE STELLARIS</div>
  <div class="loader-bar-wrap"><div class="loader-bar"></div></div>
  <div class="loader-sub">Loading Environment</div>
</div>

<!-- TRANSITION OVERLAY -->
<div id="transition-overlay"></div>

<!-- HOME VIEW (carousel injected by home.js) -->
<div id="home-view"></div>

<!-- ═══════════════════════════════════════════════════════
     LEAD GATE — Fullscreen luxury landing page shown BEFORE
     the 3D scene loads. After submit → startApp() fires via
     dismissGateAndStart() (defined below, unchanged).
════════════════════════════════════════════════════════ -->
<div id="lead-gate">

  <div class="brg-hero-bg" aria-hidden="true"></div>

  <div class="brg-layout">

    <!-- RIGHT — registration card -->
    <div class="brg-right">
      <div class="brg-card">

        <div class="brg-card-brand">Brigade Stellaris</div>
        <h2 class="brg-card-title">Register Your Interest</h2>
        <p class="brg-card-subtitle">Share your details to begin the experience</p>

        <form id="leadForm" autocomplete="off" novalidate>

          <div id="lead-error" class="brg-error" role="alert" style="display:none;"></div>

          <div class="brg-field">
            <label class="brg-label" for="Name">Name <span class="brg-req">*</span></label>
            <input type="text" id="Name" class="brg-input" maxlength="80" placeholder="Your full name" />
          </div>

          <div class="brg-field">
            <label class="brg-label" for="Phone">Phone Number <span class="brg-req">*</span></label>
            <input type="text" id="Phone" class="brg-input" maxlength="30" placeholder="+91 00000 00000" />
          </div>

          <div class="brg-field">
            <label class="brg-label" for="Email">Email <span class="brg-req">*</span></label>
            <input type="text" id="Email" class="brg-input" maxlength="100" placeholder="you@email.com" />
          </div>

          <input type="submit" id="submitLeadBtn" class="brg-submit" value="Begin Experience" />

        </form>

        <button type="button" id="gate-skip" class="brg-skip">Skip</button>

      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<!-- App modules -->
<script src="js/home.js"></script>
<script src="js/floorplan.js"></script>
<script src="js/gallery.js"></script>

<!-- Lead collection — communicates only with the Google Apps Script Web App -->
<script src="js/Config.js"></script>
<script src="js/lead.js"></script>

<script>
/* ─── GATE DISMISS → START 3D APP ─── */
let _appStarted = false;

function dismissGateAndStart() {
  if (_appStarted) return;
  _appStarted = true;

  var gate = document.getElementById('lead-gate');
  if (gate) {
    gate.classList.add('fade-out');
    setTimeout(function() { gate.remove(); }, 700);
  }

  if (typeof gtag === 'function') {
    gtag('event', 'experience_start');
  }

  // Start the 3D modules — same as firebase-auth.js did
  if (window.HomeModule      && typeof HomeModule.init      === 'function') HomeModule.init();
  if (window.FloorplanModule && typeof FloorplanModule.init === 'function') FloorplanModule.init();
  if (window.GalleryModule   && typeof GalleryModule.init   === 'function') GalleryModule.init();
}

// Skip — bypasses lead capture entirely and jumps straight into the
// experience. Deliberately calls dismissGateAndStart() directly
// rather than going through lead.js, so no lead is ever recorded
// for a skipped visit.
document.getElementById('gate-skip')?.addEventListener('click', dismissGateAndStart);

/* ─── APP CONTROLLER ─── */
window.App = {
  currentView: 'home',
  previousView: null,

  init() {
    // Do NOT auto-start — gate controls when 3D begins
    // (HomeModule.init is called by dismissGateAndStart)
  },

  finishLoad() {
    const loader = document.getElementById('loader');
    if (!loader) return;
    loader.classList.add('fade-out');
    setTimeout(() => {
      loader.style.display = 'none';
      const hv = document.getElementById('home-view');
      if (hv) hv.classList.add('active');
    }, 900);
  },

  navigate(view, opts = {}) {
    const overlay = document.getElementById('transition-overlay');
    overlay.classList.add('flash');
    overlay.addEventListener('animationend', () => {
      this._doNavigate(view, opts);
      overlay.classList.remove('flash');
    }, { once: true });
  },

  _doNavigate(view, opts) {
    const ur = document.getElementById('unit-row');
    if (ur) ur.classList.remove('visible');

    const btn360 = document.querySelector('.panel-slot[data-slot="360view"]');
    if (btn360) btn360.classList.remove('unit-open', 'active');

    document.getElementById('home-view').classList.remove('active');

    this.previousView = this.currentView;
    this.currentView  = view;

    if (view === 'home') {
      document.getElementById('home-view').classList.add('active');
    }

    document.querySelectorAll('.panel-slot').forEach(el => el.classList.remove('active'));
    const activeSlot = document.querySelector(`.panel-slot[data-slot="${view}"]`);
    if (activeSlot) activeSlot.classList.add('active');

    // Track this view switch in GA4 — lets you see which sections people
    // actually reach and how they move between them (home -> floorplan -> gallery etc.)
    if (typeof gtag === 'function') {
      gtag('event', 'view_change', {
        view_name: view,
        previous_view: this.previousView || 'none'
      });
    }
  },

  goBack() {
    this.navigate(this.previousView || 'home');
  }
};

App.init();
</script>
</body>
</html>
