<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brigade Stellaris · 360° Virtual Tour</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* ── Design tokens — matched exactly from PDF ── */
    :root {
      --rust:         #7a3e1e;
      --rust-light:   #9b5030;
      --rust-dim:     rgba(122,62,30,0.15);
      --rust-border:  rgba(122,62,30,0.25);
      --bg:           #f2ede8;       /* warm off-white page bg */
      --panel-bg:     #ffffff;       /* pure white panel */
      --text-dark:    #1a1208;       /* near-black for headings */
      --text-mid:     #3d2e1e;       /* body text */
      --text-dim:     rgba(61,46,30,0.45);
      --cream:        #f5f0ea;
      --shadow:       rgba(30,16,6,0.12);
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Montserrat', sans-serif;
      color: var(--text-dark);
    }

    /* ── Canvas sits behind everything ── */
    canvas {
      position: fixed !important;
      top: 0; left: 0;
      width: 100% !important;
      height: 100% !important;
      z-index: 1;
    }

    /* ══════════════════════════════════════════
       VIEW SWITCH PILL  (top-center)
       PDF: white pill, rust active segment
    ══════════════════════════════════════════ */
    #view-switch {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 900;
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.95);
      border: 1px solid var(--rust-border);
      border-radius: 999px;
      padding: 4px;
      user-select: none;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 2px 20px var(--shadow), 0 1px 4px rgba(0,0,0,0.08);
    }

    /* Sliding rust indicator */
    #vs-track {
      position: absolute;
      top: 4px;
      height: calc(100% - 8px);
      border-radius: 999px;
      background: var(--rust);
      box-shadow: 0 2px 10px rgba(122,62,30,0.35);
      transition: left 0.32s cubic-bezier(0.4,0,0.2,1),
                  width 0.32s cubic-bezier(0.4,0,0.2,1);
      pointer-events: none;
    }

    .vs-btn {
      position: relative;
      z-index: 1;
      padding: 8px 22px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.25s;
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .vs-btn svg {
      width: 12px; height: 12px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* Active = white text on rust track */
    .vs-btn.active { color: #ffffff; }

    @media (max-width: 480px) {
      .vs-btn { padding: 7px 13px; font-size: 9px; letter-spacing: 1px; }
      #view-switch { top: 10px; }
      #side-panel { width: 100vw; }
      #toggle.open { left: 100vw; }
    }

    /* ══════════════════════════════════════════
       PANEL TOGGLE ARROW
       PDF: rust-brown tab on left edge
    ══════════════════════════════════════════ */
    #toggle {
      position: fixed;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      z-index: 700;
      width: 26px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--rust);
      border: none;
      border-radius: 0 10px 10px 0;
      cursor: pointer;
      color: #ffffff;
      font-size: 12px;
      transition: background 0.2s,
                  left 0.32s cubic-bezier(0.4,0,0.2,1);
      box-shadow: 3px 0 14px rgba(122,62,30,0.30);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #toggle:hover { background: var(--rust-light); }
    #toggle.open  { left: 260px; }

    /* ══════════════════════════════════════════
       SIDE PANEL — white, PDF-matched
    ══════════════════════════════════════════ */
    #side-panel {
      position: fixed;
      left: 0; top: 0;
      width: 260px; height: 100%;
      background: #ffffff;
      border-right: 1px solid rgba(122,62,30,0.18);
      transform: translateX(-100%);
      transition: transform 0.32s cubic-bezier(0.4,0,0.2,1);
      z-index: 650;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      scrollbar-width: none;
      box-shadow: 6px 0 32px rgba(30,16,6,0.14);
    }

    #side-panel::-webkit-scrollbar { width: 0; }
    #side-panel.open { transform: translateX(0); }

    /* Rust top accent bar */
    #side-panel::before {
      content: '';
      display: block;
      height: 4px;
      background: var(--rust);
      flex-shrink: 0;
    }

    /* Panel header */
    #panel-header {
      padding: 20px 18px 14px;
      flex-shrink: 0;
      background: #ffffff;
    }

    #panel-header .ph-eyebrow {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--rust);
      margin-bottom: 5px;
    }

    #panel-header .ph-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 600;
      color: var(--text-dark);
      letter-spacing: 0px;
      line-height: 1.15;
    }

    /* Divider */
    .panel-divider {
      height: 1px;
      margin: 0;
      background: rgba(122,62,30,0.15);
      flex-shrink: 0;
    }

    /* Room list */
    #room-list {
      flex: 1;
      padding: 0;
      display: flex;
      flex-direction: column;
    }

    /* ── Room buttons — smart tile with thumbnail bg ── */
    .room-btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0;
      height: 56px;
      cursor: pointer;
      border: none;
      border-bottom: 1px solid rgba(122,62,30,0.10);
      background: #1a1208;
      transition: background 0.2s;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    .room-btn:hover { background:  #0d0a06; }
    .room-btn.active { background: var(--rust); }

    /* Thumbnail — fills the button as background tile */
    .room-btn .thumb {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0.55;
      transition: opacity 0.3s, transform 0.4s;
      display: block;
    }

    .room-btn:hover .thumb    { opacity: 0.75; transform: scale(1.04); }
    .room-btn.active .thumb   { opacity: 0.50; }

    /* Gradient scrim so text stays readable */
    .room-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: transparent;
      pointer-events: none;
    }

    .room-btn.active::after {
       background: linear-gradient(90deg, rgba(248,244,240,0.6) 0%, rgba(248,244,240,0.1) 100%);
    }

    /* Text container sits above the image */
    .room-btn-inner {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 18px;
      width: 100%;
    }

    /* Row number */
    .room-num {
      font-size: 10px;
      font-weight: 500;
      color: #c9a23a;
      opacity: 0.6;
      flex-shrink: 0;
      min-width: 26px;
      font-family: 'Montserrat', sans-serif;
    }

    .room-btn.active .room-num { color: rgba(255,255,255,0.7); opacity: 1; }

    /* Room name */
    .room-name {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #1a0f00;
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .room-btn.active .room-name { color: #ffffff; font-weight: 600; }

    /* Panel footer */
    #panel-footer {
      padding: 14px 18px;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-dim);
      flex-shrink: 0;
      border-top: 1px solid rgba(122,62,30,0.12);
      background: #ffffff;
    }

    /* ══════════════════════════════════════════
       ROOM LABEL (bottom center)
    ══════════════════════════════════════════ */
    #room-label {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 800;
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: #ffffff;
      background: rgba(122,62,30,0.88);
      padding: 9px 24px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      pointer-events: none;
      box-shadow: 0 4px 20px rgba(122,62,30,0.30);
      white-space: nowrap;
    }

    /* ══════════════════════════════════════════
       FADE OVERLAY
    ══════════════════════════════════════════ */
    #fade-overlay {
      position: fixed; inset: 0;
      z-index: 500;
      background: var(--bg);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    #fade-overlay.fading {
      opacity: 1;
      pointer-events: all;
    }

    /* ══════════════════════════════════════════
       ROTATE WARNING
    ══════════════════════════════════════════ */
    #rotate-warning {
      position: fixed; inset: 0;
      background: var(--bg);
      color: var(--text-mid);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      z-index: 9999;
      text-align: center;
      padding: 20px;
      display: none;
    }

    #rotate-warning span { font-size: 30px; }

    /* ══════════════════════════════════════════
       CORNER ACCENTS
    ══════════════════════════════════════════ */
    .corner-accent {
      position: fixed;
      width: 32px; height: 32px;
      border-color: var(--rust-border);
      border-style: solid;
      pointer-events: none;
      z-index: 800;
    }
    .corner-accent.tl { top: 14px; left: 14px; border-width: 1px 0 0 1px; }
    .corner-accent.tr { top: 14px; right: 14px; border-width: 1px 1px 0 0; }
    .corner-accent.bl { bottom: 14px; left: 14px; border-width: 0 0 1px 1px; }
    .corner-accent.br { bottom: 14px; right: 14px; border-width: 0 1px 1px 0; }

    @media (max-width: 768px) { .corner-accent { display: none; } }
  </style>
</head>

<body>

  <!-- ── Corner Accents ── -->
  <div class="corner-accent tl"></div>
  <div class="corner-accent tr"></div>
  <div class="corner-accent bl"></div>
  <div class="corner-accent br"></div>

  <!-- ── VIEW SWITCH PILL ── -->
  <div id="view-switch">
    <div id="vs-track"></div>

    <button class="vs-btn active" id="btn-fp" onclick="AppView.switchTo('floorplan')" aria-label="Floor Plan view">
      <svg viewBox="0 0 16 16"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
      Floor Plan
    </button>

    <button class="vs-btn" id="btn-360" onclick="AppView.switchTo('360')" aria-label="360° view">
      <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5" fill="none"/><ellipse cx="8" cy="8" rx="3" ry="7" stroke="currentColor" stroke-width="1.5" fill="none"/><line x1="1" y1="8" x2="15" y2="8" stroke="currentColor" stroke-width="1.5"/></svg>
      360° View
    </button>
  </div>

  <!-- ── PANEL TOGGLE ── -->
  <div id="toggle" aria-label="Toggle side panel">❯</div>

  <!-- ── FADE OVERLAY ── -->
  <div id="fade-overlay"></div>

  <!-- ── SIDE PANEL ── -->
  <div id="side-panel">
    <div id="panel-header">
      <div class="ph-eyebrow">4 BHK Virtual</div>
      <div class="ph-title">Select a Room</div>
    </div>
    <div class="panel-divider"></div>
    <div id="room-list"></div>
    <div id="panel-footer">Brigade Stellaris</div>
  </div>

  <!-- ── ROOM LABEL ── -->
  <div id="room-label">LOBBY</div>

  <!-- ── ROTATE WARNING ── -->
  <div id="rotate-warning">
    <span>🔄</span>
    Please rotate your device to landscape
  </div>

  <!-- ── ORIENTATION CHECK ── -->
  <script>
    function checkOrientation () {
      const warn = document.getElementById('rotate-warning')
      if (!warn) return
      const isPortrait = window.innerHeight > window.innerWidth && window.innerWidth <= 768
      warn.style.display = isPortrait ? 'flex' : 'none'
    }
    window.addEventListener('resize', checkOrientation)
    window.addEventListener('orientationchange', checkOrientation)
    checkOrientation()
  </script>

  <!-- ── APP VIEW CONTROLLER ── -->
  <script>
    window.AppView = (function () {
      const viewer360Els = () => [
        document.getElementById('room-label'),
        document.getElementById('toggle'),
        document.getElementById('side-panel'),
      ]

      function getCanvas () { return document.querySelector('canvas') }

      let currentView = 'floorplan'

      function switchTo (view) {
        if (view === currentView) return
        currentView = view

        const pillFP  = document.getElementById('btn-fp')
        const pill360 = document.getElementById('btn-360')
        const track   = document.getElementById('vs-track')
        const activeBtn = view === 'floorplan' ? pillFP : pill360

        if (pillFP && pill360 && track) {
          pillFP.classList.toggle('active', view === 'floorplan')
          pill360.classList.toggle('active', view === '360')
          const switchEl   = document.getElementById('view-switch')
          const switchRect = switchEl.getBoundingClientRect()
          const activeRect = activeBtn.getBoundingClientRect()
          track.style.left  = (activeRect.left - switchRect.left) + 'px'
          track.style.width = activeRect.width + 'px'
        }

        if (view === 'floorplan') {
          const panel  = document.getElementById('side-panel')
          const toggle = document.getElementById('toggle')
          if (panel)  panel.classList.remove('open')
          if (toggle) { toggle.classList.remove('open'); toggle.innerHTML = '❯' }
          viewer360Els().forEach(el => { if (el) el.style.display = 'none' })
          const cvs = getCanvas()
          if (cvs) cvs.style.display = 'none'
          if (window.FloorPlan) window.FloorPlan.show()
        } else {
          if (window.FloorPlan) window.FloorPlan.hide()
          viewer360Els().forEach(el => { if (el) el.style.display = '' })
          const cvs = getCanvas()
          if (cvs) cvs.style.display = 'block'
        }
      }

      function init () {
        viewer360Els().forEach(el => { if (el) el.style.display = 'none' })
        const cvs = getCanvas()
        if (cvs) cvs.style.display = 'none'
        requestAnimationFrame(() => {
          const track    = document.getElementById('vs-track')
          const btnFP    = document.getElementById('btn-fp')
          const switchEl = document.getElementById('view-switch')
          if (!track || !btnFP || !switchEl) return
          const switchRect = switchEl.getBoundingClientRect()
          const btnRect    = btnFP.getBoundingClientRect()
          track.style.left  = (btnRect.left - switchRect.left) + 'px'
          track.style.width = btnRect.width + 'px'
        })
      }

      document.addEventListener('DOMContentLoaded', init)
      setTimeout(init, 100)

      return { switchTo, current: () => currentView }
    })()
  </script>

  <!-- ── THREE.JS ── -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- ── 360 VIEWER ── -->
  <script src="main.js"></script>

  <!-- ── FLOORPLAN ── -->
  <script src="floorplan.js"></script>
  <script>
    window.FloorPlan.show()
  </script>

</body>
</html>
